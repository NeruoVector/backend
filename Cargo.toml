[package]
name = "neurovector-backend"
version = "0.1.0"
edition = "2024"
description = "NeuroVector API server (Rust, axum)"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
redis = { version = "1.7", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rskafka = "0.6"
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "derive", "uuid", "chrono", "json"] }
thiserror = "2.0"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10.0", features = ["axum", "vendored"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
